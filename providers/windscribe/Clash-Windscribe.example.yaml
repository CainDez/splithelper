# Example only: copy to local/ and fill the gateway address and credentials.
# 192.0.2.1 is a documentation address, not a working gateway.
mixed-port: 7897
mode: rule
find-process-mode: strict
log-level: info
ipv6: false
allow-lan: false
bind-address: 127.0.0.1
tun:
  enable: false
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: redir-host
  respect-rules: false
  nameserver:
  - https://1.1.1.1/dns-query#Windscribe
  nameserver-policy:
    geosite:cn:
    - https://223.5.5.5/dns-query#ChinaDirect
proxies:
- name: Official
  type: socks5
  server: 192.0.2.1
  port: 61053
  username: "CHANGE_ME_GATEWAY_USERNAME"
  password: "CHANGE_ME_GATEWAY_PASSWORD"
  udp: false
- name: ChinaDirect
  type: socks5
  server: 127.0.0.1
  port: 18997
  udp: false
proxy-groups:
- name: Windscribe
  type: select
  proxies:
  - Official
rules:
- PROCESS-NAME,Windscribe.exe,DIRECT
- IP-CIDR,0.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
- IP-CIDR,255.255.255.255/32,DIRECT,no-resolve
- IP-CIDR6,::1/128,DIRECT,no-resolve
- IP-CIDR6,fc00::/7,DIRECT,no-resolve
- IP-CIDR6,fe80::/10,DIRECT,no-resolve
- IP-CIDR6,ff00::/8,DIRECT,no-resolve
- GEOSITE,private,DIRECT
- GEOSITE,cn,ChinaDirect
- GEOIP,CN,ChinaDirect,no-resolve
- IP-CIDR,1.1.1.1/32,Windscribe,no-resolve
- IP-CIDR,8.8.8.8/32,Windscribe,no-resolve
